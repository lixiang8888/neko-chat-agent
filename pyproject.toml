[project]
name = "neko-chat"
version = "1.0.0"
description = "猫娘聊天 —— 撑得住 200+ 回合、数值不被玩坏的恋爱养成系统"
requires-python = ">=3.10"

# 只有在线模式需要 requests。离线模式（全部测试 + StubBackend）是零依赖的，
# 所以 src/deepseek.py 里用的是惰性导入 —— 别改成模块级 import，
# 那会让 138 项离线测试在裸 Python 下跑不起来。
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.141.1",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.53.0",
]

# 没有 [project.scripts]：这是个脚本工程不是可安装包，入口就是 `python main.py`。
# 定义入口点但不打包会让 uv 每次都警告，徒增噪音。

[tool.uv]
package = false

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]
